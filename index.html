<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Chart · WebGL2 多副图组件示例</title>
    <script>
      // 可见的加载诊断：模块/资源加载失败或数据迟迟未就绪时直接显示在页面上
      window.__chartErrors = [];
      function pushFatal(msg) {
        window.__chartErrors.push(msg);
        var box = document.getElementById("fatal");
        if (box) {
          box.style.display = "block";
          box.textContent =
            "加载诊断：" + window.__chartErrors.slice(-3).join(" | ");
        }
      }
      window.addEventListener(
        "error",
        function (e) {
          if (typeof CustomEvent !== "undefined" && e instanceof CustomEvent)
            return; // 忽略组件自定义 chart-error
          if (/ResizeObserver loop/i.test(e.message || "")) return; // 浏览器良性通知，不影响渲染
          var src = e.target && (e.target.src || e.target.href);
          pushFatal(
            src
              ? "资源加载失败 " + src
              : "脚本错误 " + (e.message || "unknown"),
          );
        },
        true,
      );
      window.addEventListener("unhandledrejection", function (e) {
        pushFatal(
          "Promise 拒绝 " +
            ((e.reason && e.reason.message) || String(e.reason)),
        );
      });
      window.addEventListener("DOMContentLoaded", function () {
        if (window.__chartErrors.length) pushFatal("(模块链可能未完整加载)");
        setTimeout(function () {
          var st = document.getElementById("status");
          if (st && /等待|加载中/.test(st.textContent)) {
            pushFatal(
              "数据未就绪：请确认通过 HTTP 访问，且 src/data 目录可读取",
            );
          }
        }, 3500);
      });
    </script>
  </head>
  <body>
    <header>
      <h1>Stock Chart · WebGL2 主图 + 多副图组件</h1>
      <div class="sub">
        单 canvas / 单 WebGL2 context / scissor 多 pane ·
        数据为固定历史交易日的稳定示例 case
      </div>
    </header>
    <div
      id="fatal"
      class="page-fatal"
      style="
        display: none;
        margin: 10px 20px;
        padding: 8px 12px;
        border-radius: 6px;
        font: 12px/1.5 system-ui;
      "
    ></div>

    <!-- 数据演示：切换示例数据场景与展示口径，属于演示配置，不属于行情功能 -->
    <div class="demo-bar">
      <span class="group-label">数据演示</span>
      <span style="flex: 1"></span>
      <span class="tag page-status ok" id="status">等待加载…</span>
      <span class="tag" id="compute-mode">计算引擎：js</span>
    </div>

    <main>
      <stock-workspace id="workspace"></stock-workspace>
    </main>

    <footer>
      数据来源与 mock 说明见
      <a href="./src/data/SOURCES.md">src/data/SOURCES.md</a>； 设计依据见
      docs/01（数据格式）、docs/02（扩展数据类型）、docs/03（架构方案）。
      本页仅用于验证数据结构与组件渲染，不含投资建议。
    </footer>

    <script type="module">
      // 组件模块本身无副作用，统一由注册入口显式升级标签
      import {
        defineAll,
        loadDataset,
        parseWorkspaceConfig,
        WORKSPACE_EVENTS,
      } from "./dist/index.js";
      defineAll();
      const ws = document.getElementById("workspace");

      // 页面壳自有静态主题：初始化按 URL 设一次自己的 data-theme（:has() 的兼容 fallback）
      document.documentElement.dataset.theme =
        new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";

      // 页面壳自己的轻量配置同步：订阅组件根派发的配置变更，仅在 patch.theme 存在时
      // 跟随更新 data-theme。只同步 dataset，不写任何样式变量；自定义对象色板按 light 处理。
      ws.addEventListener(WORKSPACE_EVENTS.CONFIG_CHANGE, (e) => {
        const patch = e.detail && e.detail.patch;
        if (patch && "theme" in patch) {
          document.documentElement.dataset.theme =
            String(patch.theme) === "dark" ? "dark" : "light";
        }
      });

      // 页面级状态提示（#status / #compute-mode 仍在 .demo-bar 内）
      const status = document.getElementById("status");
      const setStatus = (text, bad = false) => {
        status.textContent = text;
        status.classList.toggle("bad", bad);
        status.classList.toggle("ok", !bad);
      };
      if (location.protocol === "file:")
        setStatus("请用 HTTP 打开（file:// 无法 fetch 数据）", true);

      // 1) 配置：URL 参数 → 标准配置对象 → 组件（组件不读 URL / 不 fetch 路径）
      const cfg = parseWorkspaceConfig(new URLSearchParams(location.search));
      ws.config = cfg;

      // 2) 数据：页面负责加载，结构化对象注入组件；模块集与配置同源，数据按需派生。
      // cfg.modules 为空（?modules= 空串）时不传 modules 键，避免空数组吞掉 preset。
      setStatus("正在加载行情数据…");
      const dataPromise = cfg.modules && cfg.modules.length
        ? loadDataset("./src/data", { modules: cfg.modules, preset: cfg.preset ?? "full" })
        : loadDataset("./src/data", { preset: cfg.preset ?? "full" });
      dataPromise
        .then((data) => {
          ws.data = data;
          setStatus("就绪");
        })
        .catch((e) => {
          setStatus(`加载失败：${e.message}`, true);
          window.pushFatal?.(e.message);
        });

      // 3) 只订阅事件做页面级诊断，不再操作组件内部 DOM
      ws.addEventListener("chart-error", (e) => {
        setStatus(`错误：${e.detail.message}`, true);
        window.pushFatal?.(e.detail.message);
      });
      ws.addEventListener("webglcontext-lost", () =>
        setStatus("WebGL 上下文丢失", true),
      );
      ws.addEventListener("webglcontext-restored", () =>
        setStatus("WebGL 上下文已恢复", false),
      );
    </script>
  </body>
</html>
